name: Publish Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Published release to publish again
        required: true
        type: string

concurrency:
  group: "publish-release-${{ github.event.release.tag_name || inputs.tag }}"
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  release:
    name: Publish / Validate release
    if: github.repository == 'NVIDIA/cuspa'
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    permissions:
      contents: read
    steps:
      - name: Validate the release
        id: release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$ ]]
          case "$GITHUB_EVENT_NAME" in
            release)
              [[ "$GITHUB_REF" == "refs/tags/${RELEASE_TAG}" ]]
              ;;
            workflow_dispatch)
              [[ "$GITHUB_REF" == refs/heads/main ]]
              ;;
            *)
              exit 1
              ;;
          esac
          version="${RELEASE_TAG#v}"
          prerelease=false
          if [[ "$version" == *rc* ]]; then
            prerelease=true
          fi

          # The release service downloads the published assets, so the
          # release must already be immutable.
          gh api "repos/${GH_REPO}/releases/tags/${RELEASE_TAG}" |
            jq -e --arg tag "$RELEASE_TAG" --argjson prerelease "$prerelease" '
              .draft == false and .immutable == true and
              .tag_name == $tag and .prerelease == $prerelease
            ' > /dev/null
          sha="$(gh api "repos/${GH_REPO}/commits/${RELEASE_TAG}" --jq .sha)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          on_main="$(gh api "repos/${GH_REPO}/compare/${sha}...main" --jq .status)"
          [[ "$on_main" == ahead || "$on_main" == identical ]]

          {
            printf 'prerelease=%s\n' "$prerelease"
            printf 'sha=%s\n' "$sha"
            printf 'tag=%s\n' "$RELEASE_TAG"
            printf 'version=%s\n' "$version"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Publish / Verify release assets
    needs:
      - release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      manifest-digest: ${{ steps.assets.outputs.manifest-digest }}
    permissions:
      actions: read
      contents: read
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ needs.release.outputs.sha }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          version: "0.9.25"
      - name: Verify the release holds what Prepare Release built
        id: assets
        run: |
          release_json="$(gh api "repos/${GH_REPO}/releases/tags/${RELEASE_TAG}")"
          jq -e '
            (.assets | length) == 7 and
            ([.assets[].state] | all(. == "uploaded")) and
            ([.assets[].name] | unique | length) == 7
          ' <<< "$release_json" > /dev/null
          gh release download "$RELEASE_TAG" --dir release-dist
          [[ "$(find release-dist -maxdepth 1 -type f | wc -l)" -eq 7 ]]
          while IFS=$'\t' read -r name digest; do
            [[ "$name" == "$(basename "$name")" ]]
            [[ "$digest" == "sha256:$(sha256sum "release-dist/${name}" | cut -d ' ' -f 1)" ]]
          done < <(jq -r '.assets[] | [.name, (.digest // "")] | @tsv' <<< "$release_json")

          run_id="$(
            gh run list --workflow release.yml --event push --branch "$RELEASE_TAG" \
              --status success --limit 20 --json databaseId,headSha |
              jq -r --arg sha "$RELEASE_SHA" \
                '[.[] | select(.headSha == $sha)][0].databaseId // empty'
          )"
          [[ "$run_id" =~ ^[0-9]+$ ]]
          gh run download "$run_id" --name "cuspa-release-${RELEASE_TAG}" --dir prepared
          for file in prepared/*; do
            cmp "$file" "release-dist/$(basename "$file")"
          done
          [[ "$(find prepared -maxdepth 1 -type f | wc -l)" -eq 7 ]]

          source_base="https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}"
          jq -e \
            --arg repository "$GH_REPO" \
            --arg tag "$RELEASE_TAG" \
            --arg version "$RELEASE_VERSION" \
            --arg commit "$RELEASE_SHA" \
            --arg source_base "$source_base" '
              .schemaVersion == 1 and
              .repository == $repository and
              .tag == $tag and
              .version == $version and
              .commit == $commit and
              (.artifacts | length) == 5 and
              ([.artifacts[].name] | unique | length) == 5 and
              ([.artifacts[] | select(.sourcePointer != "\($source_base)/\(.name)")] |
                length == 0)
            ' release-dist/manifest.json > /dev/null

          expected_sums="${RUNNER_TEMP}/SHA256SUMS"
          : > "$expected_sums"
          while IFS=$'\t' read -r name size digest; do
            [[ "$name" =~ ^cuspa(_cu(12|13))?-[A-Za-z0-9.+]+.*(\.whl|\.tar\.gz)$ ]]
            [[ "$(stat -c %s "release-dist/${name}")" == "$size" ]]
            [[ "$(sha256sum "release-dist/${name}" | cut -d ' ' -f 1)" == "$digest" ]]
            printf '%s  %s\n' "$digest" "$name" >> "$expected_sums"
          done < <(jq -r '.artifacts[] | [.name, .size, .sha256] | @tsv' release-dist/manifest.json)
          cmp "$expected_sums" release-dist/SHA256SUMS

          mapfile -t wheels < <(compgen -G 'release-dist/*.whl')
          mapfile -t sdists < <(compgen -G 'release-dist/*.tar.gz')
          [[ "${#wheels[@]}" -eq 4 ]]
          [[ "${#sdists[@]}" -eq 1 ]]
          [[ -f "release-dist/cuspa-${RELEASE_VERSION}.tar.gz" ]]
          for cuda in 12 13; do
            for arch in x86_64 aarch64; do
              mapfile -t matches < <(
                compgen -G \
                  "release-dist/cuspa_cu${cuda}-${RELEASE_VERSION}-*_${arch}.whl"
              )
              [[ "${#matches[@]}" -eq 1 ]]
            done
          done
          uvx --from twine==7.0.0 twine check --strict \
            release-dist/*.whl release-dist/*.tar.gz
          for wheel in "${wheels[@]}"; do
            uvx --from abi3audit==0.0.26 abi3audit --strict "$wheel"
          done

          manifest_digest="$(sha256sum release-dist/manifest.json | cut -d ' ' -f 1)"
          printf 'manifest-digest=%s\n' "$manifest_digest" >> "$GITHUB_OUTPUT"
          {
            printf '### Release assets verified\n\n'
            printf 'Approve the upload once the release review for %s has passed.\n' \
              "$RELEASE_TAG"
          } >> "$GITHUB_STEP_SUMMARY"

  dry-run:
    name: Publish / Dry run / ${{ matrix.project }}
    needs:
      - release
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment: release-staging
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: cuspa
            project-id: ${{ vars.KITMAKER_PROJECT_ID_CUSPA }}
            pattern: ^cuspa-[A-Za-z0-9.+]+\.tar\.gz$
            count: 1
          - project: cuspa-cu12
            project-id: ${{ vars.KITMAKER_PROJECT_ID_CUSPA_CU12 }}
            pattern: ^cuspa_cu12-[A-Za-z0-9.+]+-.*\.whl$
            count: 2
          - project: cuspa-cu13
            project-id: ${{ vars.KITMAKER_PROJECT_ID_CUSPA_CU13 }}
            pattern: ^cuspa_cu13-[A-Za-z0-9.+]+-.*\.whl$
            count: 2
    steps:
      - name: Check out the release scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download the release manifest
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: gh release download "$RELEASE_TAG" --pattern manifest.json --dir release-dist
      - name: Set up the tunnel client
        uses: teleport-actions/setup@b638ff596557cc3959eb6b5287d5e58e0c8ac6a6 # v1.1.1
        with:
          version: auto
          proxy: ext-nv-prd-apps.teleport.sh:443
      - name: Open the tunnel
        uses: teleport-actions/application-tunnel@bb7a8fbfb67b85d26013554f10d71dd032c1c764 # v1.0.1
        with:
          proxy: ext-nv-prd-apps.teleport.sh:443
          token: charon-gha-runners
          app: charon
          listen: tcp://127.0.0.1:8888
      - name: Dry run
        env:
          TUNNEL_URL: http://127.0.0.1:8888
          EXPECTED_COUNT: ${{ matrix.count }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          KITMAKER_API_TOKEN: ${{ secrets.KITMAKER_PORTAL_AUTHORIZATION }}
          KITMAKER_PIC_EMAIL: ${{ secrets.KITMAKER_PORTAL_ACC_OWNER_EMAIL }}
          PROJECT_ID: ${{ matrix.project-id }}
          PROJECT_NAME: ${{ matrix.project }}
          PROJECT_PATTERN: ${{ matrix.pattern }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          bash --noprofile --norc ci/kitmaker_release.sh \
            false "$PROJECT_ID" "$PROJECT_NAME" "$KITMAKER_PIC_EMAIL" \
            "$PROJECT_PATTERN" "$EXPECTED_COUNT" release-dist/manifest.json

  upload:
    name: Publish / Upload / ${{ matrix.project }}
    needs:
      - release
      - verify
      - dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: publish
    permissions:
      contents: read
      id-token: write
      statuses: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: cuspa
            project-id: ${{ vars.KITMAKER_PROJECT_ID_CUSPA }}
            pattern: ^cuspa-[A-Za-z0-9.+]+\.tar\.gz$
            count: 1
          - project: cuspa-cu12
            project-id: ${{ vars.KITMAKER_PROJECT_ID_CUSPA_CU12 }}
            pattern: ^cuspa_cu12-[A-Za-z0-9.+]+-.*\.whl$
            count: 2
          - project: cuspa-cu13
            project-id: ${{ vars.KITMAKER_PROJECT_ID_CUSPA_CU13 }}
            pattern: ^cuspa_cu13-[A-Za-z0-9.+]+-.*\.whl$
            count: 2
    steps:
      - name: Require a passing release review
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          MANIFEST_DIGEST: ${{ needs.verify.outputs.manifest-digest }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
        run: |
          [[ "$MANIFEST_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          # The release review sets this status for the reviewed manifest.
          attestation="$(
            gh api "repos/${GH_REPO}/commits/${RELEASE_SHA}/status" \
              --jq '.statuses[] | select(.context == "release/review") | [.state, .description] | @tsv'
          )"
          IFS=$'\t' read -r state description <<< "$attestation"
          if [[ "$state" != success || "$description" != *"; manifest ${MANIFEST_DIGEST:0:12}" ]]; then
            printf 'No passing release review for this release (status: %s).\n' "${state:-none}" >&2
            printf 'Complete the release review, then re-run this job.\n' >&2
            exit 1
          fi
          printf '%s\n' "$description"
      - name: Check out the release scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download the release manifest
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: gh release download "$RELEASE_TAG" --pattern manifest.json --dir release-dist
      - name: Set up the tunnel client
        uses: teleport-actions/setup@b638ff596557cc3959eb6b5287d5e58e0c8ac6a6 # v1.1.1
        with:
          version: auto
          proxy: ext-nv-prd-apps.teleport.sh:443
      - name: Open the tunnel
        uses: teleport-actions/application-tunnel@bb7a8fbfb67b85d26013554f10d71dd032c1c764 # v1.0.1
        with:
          proxy: ext-nv-prd-apps.teleport.sh:443
          token: charon-gha-runners
          app: charon
          listen: tcp://127.0.0.1:8888
      - name: Upload
        env:
          TUNNEL_URL: http://127.0.0.1:8888
          EXPECTED_COUNT: ${{ matrix.count }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          KITMAKER_API_TOKEN: ${{ secrets.KITMAKER_PORTAL_AUTHORIZATION }}
          KITMAKER_PIC_EMAIL: ${{ secrets.KITMAKER_PORTAL_ACC_OWNER_EMAIL }}
          PROJECT_ID: ${{ matrix.project-id }}
          PROJECT_NAME: ${{ matrix.project }}
          PROJECT_PATTERN: ${{ matrix.pattern }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          bash --noprofile --norc ci/kitmaker_release.sh \
            true "$PROJECT_ID" "$PROJECT_NAME" "$KITMAKER_PIC_EMAIL" \
            "$PROJECT_PATTERN" "$EXPECTED_COUNT" release-dist/manifest.json
