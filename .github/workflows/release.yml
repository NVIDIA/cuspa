name: Prepare Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: "prepare-release-${{ github.ref_name }}"
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  validate:
    name: Release / Validate
    if: github.repository == 'NVIDIA/cuspa'
    runs-on: linux-amd64-cpu4
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
      release-date: ${{ steps.release.outputs.release-date }}
      sha: ${{ steps.release.outputs.sha }}
      source-date-epoch: ${{ steps.release.outputs.source-date-epoch }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    permissions:
      contents: read
    steps:
      - name: Use NVIDIA package cache
        uses: nv-gha-runners/setup-proxy-cache@14229018fe157c83e03c008f27d183d8e99bc67c # main
      - name: Check out the release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          version: "0.9.25"
      - name: Validate the release
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$GITHUB_REF" == "refs/tags/${RELEASE_TAG}" ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$ ]]
          version="${RELEASE_TAG#v}"

          sha="$(git rev-parse HEAD)"
          [[ "$sha" == "$(git rev-list -n 1 "$RELEASE_TAG")" ]]
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main
          source_date_epoch="$(git show -s --format=%ct "$sha")"
          [[ "$source_date_epoch" =~ ^[0-9]+$ ]]

          package_version="$(
            uv run --isolated --no-project \
              --with hatch-vcs==0.5.0 --with hatchling \
              python -m hatchling version
          )"
          [[ "$package_version" == "$version" ]]

          prerelease=false
          if [[ "$version" == *rc* ]]; then
            prerelease=true
          fi
          release_date="$(date -u -d "@${source_date_epoch}" +%F)"

          {
            printf 'prerelease=%s\n' "$prerelease"
            printf 'release-date=%s\n' "$release_date"
            printf 'sha=%s\n' "$sha"
            printf 'source-date-epoch=%s\n' "$source_date_epoch"
            printf 'tag=%s\n' "$RELEASE_TAG"
            printf 'version=%s\n' "$version"
          } >> "$GITHUB_OUTPUT"

  packages:
    name: Release / Build and test
    needs:
      - validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
      source-date-epoch: ${{ needs.validate.outputs.source-date-epoch }}
      version: ${{ needs.validate.outputs.version }}

  bundle:
    name: Release / Bundle
    needs:
      - validate
      - packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cuspa-cu*
          path: release-dist
          merge-multiple: true
      - name: Download source distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cuspa-sdist
          path: release-dist
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          version: "0.9.25"
      - name: Validate and describe the release bundle
        run: |
          mapfile -t wheels < <(compgen -G 'release-dist/*.whl')
          mapfile -t sdists < <(compgen -G 'release-dist/*.tar.gz')
          [[ "${#wheels[@]}" -eq 4 ]]
          [[ "${#sdists[@]}" -eq 1 ]]
          [[ -f "release-dist/cuspa-${RELEASE_VERSION}.tar.gz" ]]
          for cuda in 12 13; do
            for arch in x86_64 aarch64; do
              mapfile -t matches < <(
                compgen -G \
                  "release-dist/cuspa_cu${cuda}-${RELEASE_VERSION}-*_${arch}.whl"
              )
              [[ "${#matches[@]}" -eq 1 ]]
            done
          done

          uvx --from twine==7.0.0 twine check --strict release-dist/*
          for wheel in "${wheels[@]}"; do
            uvx --from abi3audit==0.0.26 abi3audit --strict "$wheel"
          done

          # The release service fetches the packages from the published release.
          source_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"

          mapfile -t packages < <(
            find release-dist -maxdepth 1 -type f \
              \( -name '*.whl' -o -name '*.tar.gz' \) -print | sort
          )
          artifacts='[]'
          : > release-dist/SHA256SUMS
          for package in "${packages[@]}"; do
            name="$(basename "$package")"
            digest="$(sha256sum "$package" | cut -d ' ' -f 1)"
            size="$(stat -c %s "$package")"
            source_pointer="${source_base}/${name}"
            printf '%s  %s\n' "$digest" "$name" >> release-dist/SHA256SUMS
            artifacts="$(
              jq -c \
                --arg name "$name" \
                --arg sha256 "$digest" \
                --arg sourcePointer "$source_pointer" \
                --argjson size "$size" \
                '. + [{name: $name, size: $size, sha256: $sha256, sourcePointer: $sourcePointer}]' \
                <<< "$artifacts"
            )"
          done
          [[ "$(jq 'length' <<< "$artifacts")" -eq 5 ]]
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "$RELEASE_TAG" \
            --arg version "$RELEASE_VERSION" \
            --arg commit "$RELEASE_SHA" \
            --argjson artifacts "$artifacts" \
            '{schemaVersion: 1, repository: $repository, tag: $tag, version: $version, commit: $commit, artifacts: $artifacts}' \
            > release-dist/manifest.json
          [[ "$(find release-dist -maxdepth 1 -type f | wc -l)" -eq 7 ]]
      - name: Save the release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cuspa-release-${{ needs.validate.outputs.tag }}
          path: release-dist
          if-no-files-found: error
          retention-days: 90

  draft:
    name: Release / Draft
    needs:
      - validate
      - bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - name: Download the release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cuspa-release-${{ needs.validate.outputs.tag }}
          path: release-dist
      - name: Create the draft release
        run: |
          mapfile -t files < <(find release-dist -maxdepth 1 -type f -print | sort)
          [[ "${#files[@]}" -eq 7 ]]
          [[ "$(gh api "repos/${GH_REPO}/commits/${RELEASE_TAG}" --jq .sha)" == "$RELEASE_SHA" ]]

          # The by-tag lookup skips drafts, so search the full release list.
          list_releases() {
            local releases
            releases="$(
              gh api --paginate "repos/${GH_REPO}/releases?per_page=100" \
                --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\") | [.id, .draft] | @tsv"
            )"
            listed=()
            if [[ -n "$releases" ]]; then
              mapfile -t listed <<< "$releases"
            fi
          }

          # A published release is immutable. A draft is replaced so that it
          # always holds this run's packages.
          list_releases
          for release in "${listed[@]}"; do
            IFS=$'\t' read -r id draft <<< "$release"
            if [[ "$draft" != true ]]; then
              printf 'Release %s is already published.\n' "$RELEASE_TAG" >&2
              exit 1
            fi
            gh api --method DELETE "repos/${GH_REPO}/releases/${id}"
          done

          prerelease=false
          prerelease_arg=()
          if [[ "$RELEASE_PRERELEASE" == true ]]; then
            prerelease=true
            prerelease_arg=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${files[@]}" \
            --draft --verify-tag --title "$RELEASE_TAG" --generate-notes \
            "${prerelease_arg[@]}" > /dev/null

          for _ in {1..10}; do
            list_releases
            if [[ "${#listed[@]}" -gt 0 ]]; then
              break
            fi
            sleep 3
          done
          [[ "${#listed[@]}" -eq 1 ]]
          IFS=$'\t' read -r id draft <<< "${listed[0]}"
          [[ "$draft" == true ]]
          release_json="$(gh api "repos/${GH_REPO}/releases/${id}")"
          jq -e --arg tag "$RELEASE_TAG" --argjson prerelease "$prerelease" '
            .draft == true and .tag_name == $tag and .prerelease == $prerelease and
            (.assets | length) == 7 and
            ([.assets[].state] | all(. == "uploaded"))
          ' <<< "$release_json" > /dev/null
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            digest="sha256:$(sha256sum "$file" | cut -d ' ' -f 1)"
            jq -e --arg name "$name" --arg digest "$digest" \
              '[.assets[] | select(.name == $name and .digest == $digest)] | length == 1' \
              <<< "$release_json" > /dev/null
          done

          {
            printf '### Draft release ready\n\n'
            printf 'Review the notes of [%s](%s), then publish it. ' \
              "$RELEASE_TAG" "$(jq -r .html_url <<< "$release_json")"
            printf 'Publishing makes the release immutable and starts Publish Release.\n'
          } >> "$GITHUB_STEP_SUMMARY"
