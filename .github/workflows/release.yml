name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to release
        required: true
        type: string
      run_id:
        description: Successful CI workflow run ID for this tag
        required: true
        type: string
      dry_run:
        description: Validate and assemble the release without publishing it
        required: true
        default: true
        type: boolean

concurrency:
  group: "${{ github.workflow }}-${{ inputs.tag }}"
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  validate:
    name: Release / Validate
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Read artifacts from the selected CI workflow run.
      contents: read
    steps:
      - name: Validate release inputs
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
      - name: Check out release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - name: Verify tag, package version, and CI run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          package_version="$(
            python3 -c \
              "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          )"
          [[ "$RELEASE_TAG" == "v${package_version}" ]]

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          run_name="$(jq -r .name <<< "$run_json")"
          run_event="$(jq -r .event <<< "$run_json")"
          run_conclusion="$(jq -r .conclusion <<< "$run_json")"
          run_sha="$(jq -r .head_sha <<< "$run_json")"
          printf 'CI run: %s (%s, %s, %s)\n' \
            "$run_name" "$run_event" "$run_conclusion" "$run_sha"
          [[ "$run_name" == CI ]]
          [[ "$run_event" == push ]]
          [[ "$run_conclusion" == success ]]
          [[ "$run_sha" == "$tag_sha" ]]
      - name: Download wheel artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cuspa-cu*
          path: release-dist
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
      - name: Download source distribution artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cuspa-sdist
          path: release-dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false
          version: "0.9.25"
      - name: Validate release artifacts
        run: |
          mapfile -t wheels < <(find release-dist -maxdepth 1 -type f -name '*.whl' -print)
          mapfile -t sdists < <(find release-dist -maxdepth 1 -type f -name '*.tar.gz' -print)
          [[ "${#wheels[@]}" -eq 4 ]]
          [[ "${#sdists[@]}" -eq 1 ]]
          for cuda in 12 13; do
            for arch in x86_64 aarch64; do
              compgen -G "release-dist/cuspa_cu${cuda}-*-${arch}.whl" > /dev/null
            done
          done
          uvx --from twine==7.0.0 twine check --strict release-dist/*
          for wheel in "${wheels[@]}"; do
            uvx --from abi3audit==0.0.26 abi3audit --strict "$wheel"
          done
      - name: Upload validated release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cuspa-release-${{ inputs.tag }}
          path: release-dist
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Release / Publish
    if: ${{ !inputs.dry_run }}
    needs:
      - validate
    runs-on: ubuntu-24.04
    environment: github-release
    permissions:
      actions: read # Download the validated bundle produced by this workflow.
      contents: write # Create the GitHub release and attach its assets.
    steps:
      - name: Download validated release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cuspa-release-${{ inputs.tag }}
          path: release-dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          gh release create "$RELEASE_TAG" release-dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "Cuspa ${RELEASE_TAG#v}"
