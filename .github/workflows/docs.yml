name: Docs

on:
  push:
    branches:
      - main
  # Publishing a release starts Publish Release, and its start adds the
  # release to the site. workflow_run runs on main, which github-pages accepts.
  workflow_run:
    workflows:
      - Publish Release
    types:
      - requested
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  build:
    name: Docs / Build
    if: github.repository == 'NVIDIA/cuspa'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          version: "0.9.25"
      - name: Build documentation
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python --requirement docs/requirements.txt
          releases="$(
            gh release list --exclude-drafts --limit 1000 \
              --json tagName --jq '.[].tagName'
          )"
          tags=()
          if [[ -n "$releases" ]]; then
            mapfile -t tags <<< "$releases"
          fi
          .venv/bin/python ci/build_docs_site.py docs/_build/site "${tags[@]}"
      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/site

  deploy:
    name: Docs / Deploy
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
