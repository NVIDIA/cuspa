name: Request a feature
description: Propose a capability or project improvement.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before proposing a solution. Review `CONTRIBUTING.md` before proposing a large change.

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: Explain who is affected, what they are trying to do, and why it matters.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result you want without assuming a specific implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or other approaches considered.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add related issues, references, or relevant technical constraints.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for a similar request.
          required: true
        - label: I reviewed the contribution scope in `CONTRIBUTING.md`.
          required: true
