name: Request documentation
description: Report missing, unclear, or incorrect documentation.
title: "[Docs]: "
body:
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: Link the affected page or identify the file and section. Write "Missing" when requesting new documentation.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is incorrect, unclear, outdated, or absent.
    validations:
      required: true

  - type: textarea
    id: proposed_change
    attributes:
      label: Suggested improvement
      description: Describe the correction, example, explanation, or new content needed.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include the software version, related issues, screenshots, or other useful context.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for the same documentation problem.
          required: true
