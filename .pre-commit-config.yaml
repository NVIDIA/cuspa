# Mirrors the scverse/rapids_singlecell pre-commit config (ruff + taplo +
# standard hooks + codespell + clang-format for the CUDA / C++ sources).
# Run:   pre-commit install       # once, to set up the hook
#        pre-commit run --all-files
ci:
    # Report formatting failures without rewriting contributor branches.
    autofix_prs: false
    autoupdate_schedule: monthly
    # Keep every configured hook enabled in pre-commit.ci.
    skip: []

repos:
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
    -   id: ruff-check
        args: ["--fix"]
    -   id: ruff-format
    # The following can be removed once PLR0917 is out of preview
    -   name: ruff preview rules
        id: ruff-check
        args: ["--preview", "--select=PLR0917"]
-   repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
    -   id: taplo-format
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-added-large-files
    -   id: check-case-conflict
    -   id: check-toml
    -   id: check-yaml
    -   id: check-merge-conflict
    -   id: detect-private-key
-   repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
    -   id: codespell
        additional_dependencies:
        - tomli
        exclude: |
          (?x)(
              ^BENCHMARKS\.md$|
              ^data/|
              ^build/
          )
-   repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.3
    hooks:
    -   id: clang-format
        args: [--style=file, -i]
        types_or: [c, c++, cuda]
-   repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
    -   id: actionlint
        args: ["-shellcheck="]
